[workspace]
resolver = "2"
members = [
    "crates/phechan-cli",
    "crates/phechan-bitcoin",
    "crates/phechan-psbt",
    "crates/phechan-ordinals",
    "crates/phechan-runes",
    "crates/phechan-sat",
    "crates/phechan-validation",
    "crates/phechan-keystore",
    "crates/phechan-vault",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Phechan"]
repository = "local"

[workspace.dependencies]
phechan-bitcoin = { path = "crates/phechan-bitcoin" }
phechan-psbt = { path = "crates/phechan-psbt" }
phechan-ordinals = { path = "crates/phechan-ordinals" }
phechan-runes = { path = "crates/phechan-runes" }
phechan-sat = { path = "crates/phechan-sat" }
phechan-validation = { path = "crates/phechan-validation" }
phechan-keystore = { path = "crates/phechan-keystore" }
phechan-vault = { path = "crates/phechan-vault" }
bitcoin = { version = "0.32.5", default-features = false, features = ["std", "secp-recovery"] }
secp256k1 = { version = "0.29.1", features = ["global-context", "rand"] }
sha2 = "0.10.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
hex = "0.4.3"
base64 = "0.22"
